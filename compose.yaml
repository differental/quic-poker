services:
  quic-server:
    user: "0:0"

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "5000:5000/udp"

    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # The PnL ledger and hand log live here. Without this volume they are lost
      # every time the container is replaced.
      - quic-data:/data

    environment:
      SERVER_PORT: "5000"
      FULLCHAIN_PATH: "${FULLCHAIN_PATH}"
      PRIVKEY_PATH: "${PRIVKEY_PATH}"
      DATA_DIR: "/data"

    env_file:
      - stack.env

    restart: unless-stopped

volumes:
  quic-data:
